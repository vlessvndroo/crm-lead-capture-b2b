name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build & TypeCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'lead-capture-app/package-lock.json'

      - name: Install Dependencies
        run: |
          cd lead-capture-app
          npm ci

      - name: Run Build & TypeCheck
        run: |
          cd lead-capture-app
          npm run build
